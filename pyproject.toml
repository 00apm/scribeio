[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-rpg"
version = "0.1.0"
description = "Transcripts of tabletop RPG sessions recorded with Craig (Discord)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Artur Marchewicz" }]
keywords = ["ttrpg", "transcription", "whisper", "discord", "craig"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "click>=8.2",
    "rich>=13",
    "pyyaml>=6",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Install torch with CUDA first (README), so pip keeps the GPU build.
transcribe = ["whisperx>=3.8.6,<4"]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML", "ruff>=0.6"]

[project.scripts]
scribe = "scribe_rpg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scribe_rpg = ["defaults.yaml", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests in subfolders import the shared tests/helpers.py
pythonpath = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs CUDA + WhisperX + the local excerpt in tests/local/ (deselect with -m 'not gpu')",
    "ffmpeg: needs ffmpeg in PATH",
]

[tool.ruff]
# PEP 8 via ruff: Black-compatible formatting, 88-character lines.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scribe_rpg"]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.10"     # oldest supported Python: flags newer-only APIs
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# these ship no type information
module = ["whisperx", "whisperx.*", "faster_whisper", "faster_whisper.*", "torchaudio", "torchaudio.*"]
ignore_missing_imports = true
