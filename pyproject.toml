[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scribeio"
version = "0.1.2"
description = "Balanced audio and transcripts from Craig (Discord) recordings of TTRPG sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Artur Marchewicz" }]
keywords = ["ttrpg", "transcription", "whisper", "discord", "craig"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "click>=8.2",
    "rich>=13",
    "pyyaml>=6",
    "numpy>=1.24",
    "colorama>=0.4.6; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/00apm/scribeio"
Documentation = "https://github.com/00apm/scribeio/blob/main/docs/README.md"
Issues = "https://github.com/00apm/scribeio/issues"

[project.optional-dependencies]
# Install torch with CUDA first (docs/install-own-env.md), so pip keeps the GPU build.
transcribe = ["whisperx>=3.8.6,<3.9"]
dev = ["pytest>=8", "mypy>=1.10", "types-PyYAML", "ruff>=0.6"]

[project.scripts]
scribe = "scribeio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scribeio = ["defaults.yaml", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests in subfolders import the shared tests/helpers.py
pythonpath = ["tests"]
addopts = "-ra"
markers = [
    "gpu: needs CUDA + WhisperX + the local excerpt in tests/local/ (deselect with -m 'not gpu')",
    "ffmpeg: needs ffmpeg in PATH",
]

[tool.ruff]
# PEP 8 via ruff: Black-compatible formatting, 88-character lines.
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear
select = ["E", "W", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scribeio"]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.10"     # oldest supported Python: flags newer-only APIs
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# these ship no type information, or are absent without the transcribe extra
module = ["whisperx", "whisperx.*", "faster_whisper", "faster_whisper.*", "torchaudio", "torchaudio.*", "colorama", "torch", "torch.*", "huggingface_hub", "huggingface_hub.*"]
ignore_missing_imports = true
