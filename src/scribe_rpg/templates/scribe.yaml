# scribe config, made by `scribe init`. Every key is optional: what you leave
# out comes from the built-in defaults (`scribe init --full` writes them all).
# scribe uses this file by itself when it is next to the recording (or the
# .json); elsewhere pass it with -c. Lists replace the defaults; unknown keys
# are an error, so typos are caught.
# Docs: https://github.com/00apm/scribe-rpg/tree/main/docs

# Discord account -> name in the transcript. Write the account as Discord
# shows it; accounts not listed keep their account name and are reported.
speakers:
  gm.account: Game Master
  player.one: Player One
  player.one.old: Player One   # several accounts may map to one person

input:
  music_patterns: [kenku]   # music bot tracks (substrings); add your bots here

master:
  channels: mono            # or stereo
  format: mp3               # mp3 | m4a | opus
  # music:
  #   loudness: {type: loudness, target: -36}   # lower = quieter music
  # players:                # per Discord account: changes over `voice`
  #   player.one: {stereo: true}
  #   player.two: {chain: [rumble, level, comp, eq, denoise, loudness]}

transcribe:
  glossary: glossary.txt    # names for Whisper + corrections; relative to this file
  whisper:
    language: en            # any Whisper language code; tuned and tested: en, pl
    # batch_size: 4         # lower it if you get "CUDA out of memory"
