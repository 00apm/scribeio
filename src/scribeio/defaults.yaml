# Built-in defaults. A campaign config (-c) overrides any of these keys;
# sections merge, lists replace. Every section is optional in the config, and
# each command reads only its own sections:
#   input       shared: reading Craig recordings
#   master      `scribe master`
#   transcribe  `scribe transcribe` and `scribe merge`

# Docs: https://github.com/00apm/scribeio/blob/main/docs/recordings.md
input:
  # Substrings (case-insensitive) that mark music tracks. Kenku (a Discord
  # music bot) is the default; add other names in your config (the list
  # replaces this).
  music_patterns: [kenku]

# Docs: https://github.com/00apm/scribeio/blob/main/docs/usage/audio-tuning.md
master:
  channels: mono            # mono | stereo
  format: mp3               # mp3 | m4a | opus
  bitrate: null             # null = per format: mp3 96k, m4a 64k, opus 48k
  # Each stage runs the steps in its `chain`, in order. Every other key is a
  # step: an allowed filter (`type` + its options) or scribe's `loudness`
  # (a target level; closer to 0 is louder). A step in no chain does nothing.
  voice:                    # every voice track; per-player changes go in `players`
    stereo: false           # true keeps a stereo mic stereo (with channels: stereo)
    chain: [rumble, level, comp, eq, loudness]
    rumble:   {type: highpass, f: 80}               # cuts desk thumps and mic rumble
    level:    {type: loudness, target: -19}         # same level for every player
    comp:     {type: acompressor, threshold: -15dB, ratio: 3, knee: 18dB,
               attack: 15, release: 40}             # gently evens loud and quiet words
    # warmth at 150 Hz, clarity at 3-5 kHz; entries are (Hz, dB), linear between
    eq:       {type: firequalizer, delay: 0.05,
               gain_entry: "entry(80,0);entry(150,1.5);entry(300,0);entry(2500,0);entry(3300,3);entry(5000,3);entry(6000,0)"}
    loudness: {type: loudness, target: -19}         # final voice level
    # In no chain: untested starting points; name one in a chain to use it
    hum:      {type: bandreject, f: 50, w: 2, t: h} # mains hum (60 in the Americas)
    denoise:  {type: afftdn}                        # steady background hiss
    gate:     {type: agate, threshold: -40dB, range: -12dB}  # quieter between words
    deess:    {type: deesser}                       # softens sharp "s" sounds
  music:
    chain: [loudness]
    loudness: {type: loudness, target: -36}         # well under the voices
  mix:
    chain: [limiter]
    limiter:  {type: alimiter, limit: -1.5dB, level: false}  # caps peaks; no auto gain
  players: {}               # Discord account -> changes over `voice`, same keys

# Docs: https://github.com/00apm/scribeio/blob/main/docs/usage/transcribe-tuning.md
transcribe:
  whisper:
    model: large-v3         # smaller and faster: large-v3-turbo, medium, small
    language: en            # any Whisper language code; tuned and tested: en, pl
    device: cuda            # cpu works, but very slowly
    compute_type: default   # WhisperX picks: float16 on GPU, float32 on CPU (or int8, ...)
    batch_size: 4           # lower it on "CUDA out of memory"
    prompt_max_tokens: 200  # glossary names beyond this are left out of the prompt
    align_model: null       # word alignment model; null = WhisperX default for the language

  cleanup:                  # removing Whisper hallucinations, hesitations, loops
    energy_db: -50          # a word is voiced when a slice of it is louder (0 = loudest)
    frame_ms: 50            # slice length for energy_db, in milliseconds
    voiced_ratio: 0.5       # drop a segment when voiced words / words < this
    phrase_max_words: 6     # phrase backstop applies only to segments this short
    phrases:                # known Whisper hallucinations; case-insensitive substrings
      # Polish
      - dzięki za oglądanie
      - dziękuję za oglądanie
      - pta & tvp
      - napisy stworzone
      - napisy wykonane
      - napisy przygotowane
      # English
      - thanks for watching
      - thank you for watching
      - please subscribe
      - subtitles by
      - amara.org
    keep_fillers: false     # true keeps hesitations (yyy, mmm, uh, um)
    loop_min_words: 3       # shorter texts never count as a loop
    loop_max_repeat: 3      # a repeated segment is kept at most this many times in a row

  lines:
    pause: 1.5              # seconds; a new line starts when a speaker pauses this long

  bleed:                    # same speech on two tracks (report only)
    similarity: 0.85        # how alike the two texts must be, 0 to 1
    min_words: 5            # both texts need at least this many words
    min_overlap: 0.5        # fraction of the shorter segment
