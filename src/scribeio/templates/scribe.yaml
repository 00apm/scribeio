# scribe.yaml: scribeio's settings for this recording, made by `scribe init`.
# It works as it is. A line starting with # shows a default or an example:
# remove the "# " to use it.
# All settings with their defaults: `scribe init --full`.
# Docs: https://github.com/00apm/scribeio/blob/main/docs/settings.md

# Discord account -> name in the transcript: write each person's name after
# their account (as Discord shows it). Accounts not listed keep their
# account name and are reported.
speakers:
  gm.account: Game Master
  player.one: Player One
  player.one.old: Player One   # several accounts may map to one person

input:
  music_patterns: [kenku]   # music bot tracks (part of the name); add your bots

master:
  channels: mono            # mono | stereo
  format: mp3               # mp3 | m4a | opus
  # voice:                  # every voice track
  #   loudness: {target: -19}   # voice level; higher = louder
  # music:                  # the music bot's track
  #   loudness: {target: -36}   # music level; higher = louder
  # players:                # per Discord account: changes over `voice`
  #   player.one:
  #     loudness: {target: -17}

transcribe:
  glossary: glossary.txt    # names for Whisper + corrections; relative to this file
  whisper:
    language: en            # any Whisper language code; tuned and tested: en, pl
    # model: large-v3       # smaller and faster: large-v3-turbo, medium, small
    # device: cuda          # cpu works, but very slowly
    # batch_size: 4         # lower it on "CUDA out of memory"
  # lines:
  #   pause: 1.5            # seconds; a new line starts when a speaker pauses this long
